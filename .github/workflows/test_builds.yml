name: Test builds

# Builds the frozen desktop executable on each platform with packaging/build.py and
# smoke-tests what came out, headlessly: --version must print the package version, and
# --texworker must decode an image inside the frozen bundle. The Windows leg goes on to
# build the Inno Setup installer and each macOS leg the .dmg, so phase 2 and the version
# pass-through are exercised somewhere real on both. Artifacts are uploaded for inspection; nothing here is a release.
#
# Advisory rather than required, so a paths filter is fine here, and it deliberately
# leaves gleapp/** out: a logic change inside an existing module almost never breaks the
# frozen build, and the four legs together bill about 140 minutes per run while the repo
# is private; a public repo pays nothing for standard runners. Measured on the run that
# added the Intel leg: 100 of those minutes are macos-15-intel alone, which took 9
# minutes of wall clock against Apple silicon's 3 and bills at 10x, so that one leg
# costs more than the other three together.
# Packaging and dependency changes are where frozen-build breaks come from,
# and the weekly schedule covers the rest. Modeled on iLEAPP's test_builds.yml, which
# is manual only.

on:
  workflow_dispatch:
  # A weekly build of main catches a frozen-build break that ordinary code introduces,
  # a new import PyInstaller cannot see, without paying four PyInstaller runs on every
  # pull request. Monday 06:00 UTC.
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    paths:
      - 'packaging/**'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.github/workflows/test_builds.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel is the Intel Mac leg. macos-latest is Apple silicon, and
        # release.yml ships both, so both are built here; macos-13 was retired on
        # 2025-12-04 and GitHub drops x86_64 macOS when macos-15-intel retires in 2027.
        os: [windows-latest, macos-latest, macos-15-intel, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # macOS only. The opencv-python-headless wheels for macOS vendor a Homebrew
      # FFmpeg built --enable-gpl, so they carry x264, x265, xvid, rubberband, vidstab
      # and frei0r, and cv2 hard-links the FFmpeg stack, so those cannot be stripped.
      # GLEAPP cannot ship GPL code, because the bundle also holds Apache-1.1 code
      # that the FSF lists as GPL-incompatible, and packaging/gleapp.spec refuses such
      # a build. conda-forge publishes an LGPL FFmpeg, so macOS takes OpenCV from there.
      # Its package registers opencv_python_headless dist-info, so the pip step below
      # sees the requirement satisfied and does not pull the wheel back in.
      # See "macOS: take OpenCV from conda-forge" in the README.
      # Pillow comes from conda-forge too, and that is not incidental. The PyPI
      # wheel vendors its own libharfbuzz built without CoreText, conda-forge's
      # pango needs one with it, and PyInstaller collapses two dylibs of the same
      # name into one. v2026.5.0 shipped a macOS app that could not import cv2 for
      # that reason. Taking both from conda-forge leaves one shared harfbuzz.
      - name: macOS, OpenCV and Pillow from conda-forge
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -sL "https://micro.mamba.pm/api/micromamba/osx-$(uname -m | sed s/x86_64/64/)/latest" \
            | tar -xj bin/micromamba
          ./bin/micromamba create -y -p ./build-env -c conda-forge --no-rc \
            python=3.12 "py-opencv=*=headless*" "ffmpeg=*=lgpl*" pillow
          echo "$PWD/build-env/bin" >> "$GITHUB_PATH"

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -e ".[build]"
          python -c "import cv2; print('cv2', cv2.__version__, cv2.__file__)"

      - name: Phase 1, the executable
        shell: bash
        run: python packaging/build.py exe

      # Windows only. Extracting a downloaded zip with Explorer copies the zip's
      # downloaded-from-the-internet mark (a Zone.Identifier stream, zone 3) onto every
      # file, and .NET Framework will not load an assembly that carries it: the
      # v2026.5.1 portable build failed that way on a user's machine, with "Failed to
      # resolve Python.Runtime.Loader.Initialize". Marking the build the same way before
      # the checks below makes them test what a user who downloads the zip gets.
      - name: Windows, mark the build as downloaded from the internet
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -File dist/GLEAPP
          foreach ($f in $files) {
            Set-Content -LiteralPath $f.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          }
          $marked = @($files | Where-Object { Get-Item -LiteralPath $_.FullName -Stream Zone.Identifier -ErrorAction SilentlyContinue }).Count
          Write-Host "marked $marked of $($files.Count) files"
          if ($marked -ne $files.Count -or $marked -eq 0) { exit 1 }

      # Neither check opens a window. --version is answered by packaging/entrypoint.py
      # before the desktop shell is imported; --texworker is the isolated decoder the app
      # itself re-invokes, and it exercises Pillow and the texture decoders inside the
      # frozen bundle on a real file.
      - name: Smoke test the frozen binary, headless
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=dist/GLEAPP/GLEAPP.exe; else BIN=dist/GLEAPP/GLEAPP; fi
          WANT="GLEAPP $(python -c "import sys; sys.path.insert(0, 'packaging'); import build; print(build.read_version())")"
          GOT="$("$BIN" --version)"
          echo "--version -> '$GOT'"
          [ "$GOT" = "$WANT" ] || { echo "expected '$WANT'"; exit 1; }
          python -c 'from PIL import Image; Image.new("RGB", (64, 48), (30, 120, 200)).save("smoke_in.png")'
          "$BIN" --texworker smoke_in.png smoke_out.jpg 32
          [ -s smoke_out.jpg ] || { echo "--texworker produced no output"; exit 1; }
          echo "--texworker -> $(wc -c < smoke_out.jpg) bytes"
          # The import the two checks above never make. cv2 comes in through
          # gleapp.desktop, so a bundle can pass both of them and still not start.
          "$BIN" --selfcheck
          if [ "$RUNNER_OS" = "macOS" ]; then
            APPBIN=dist/GLEAPP.app/Contents/MacOS/GLEAPP
            [ -x "$APPBIN" ] || { echo "no .app bundle produced"; exit 1; }
            echo "bundle --version -> $("$APPBIN" --version)"
            /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" dist/GLEAPP.app/Contents/Info.plist
          fi

      # Windows only. --selfcheck imports the window's backend; this opens the window
      # itself from the marked build, the way a user starts it: pythonnet loading .NET,
      # the WebView2 control, and Flask serving the launcher into it, then closes it
      # (GLEAPP_DESKTOP_SMOKE, see gleapp/desktop.py). The runner image ships Edge but
      # not the WebView2 runtime. An error here opens the windowed build's traceback
      # dialog and waits, so the step's timeout is what fails it.
      - name: Windows, open the desktop window from the marked build
        if: runner.os == 'Windows'
        timeout-minutes: 6
        shell: bash
        env:
          GLEAPP_DESKTOP_SMOKE: "1"
        run: |
          choco install webview2-runtime --no-progress -y
          dist/GLEAPP/GLEAPP.exe
          echo "window opened, loaded and closed"

      - name: Phase 2, the disk image (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python packaging/build.py installer
          ls -l dist/GLEAPP-*.dmg

      - name: Phase 2, the installer (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install innosetup --no-progress -y
          python packaging/build.py installer
          ls -l dist/GLEAPP-Setup-*.exe

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: gleapp-${{ matrix.os }}-test
          path: |
            dist/GLEAPP/
            dist/GLEAPP-Setup-*.exe
            dist/GLEAPP.app/
            dist/GLEAPP-*.dmg
          if-no-files-found: error
