name: Release

# Builds the frozen desktop app on each platform, Intel and Apple silicon Macs both,
# and attaches the results to a
# GitHub Release. Pushing a tag like v0.1.0 is the trigger; the release is created
# as a DRAFT, so the assets can be checked before anyone can download them.
#
# The build steps are the ones test_builds.yml already runs weekly on main, in the
# same order, including the conda-forge OpenCV on macOS that keeps GPL codecs out of
# the bundle. Keeping the two in step matters: this workflow only runs when a tag is
# pushed, so it is the weekly job that keeps the recipe honest between releases.
# workflow_dispatch builds every platform and uploads the assets without creating a
# release, which is the way to rehearse a release without publishing one.
#
# macOS is signed with a Developer ID and notarised when the MACOS_* secrets are set:
# the .app is codesigned between phase 1 and phase 2, then the .dmg is signed,
# notarised and stapled. A tag refuses to publish an unsigned Mac build; a
# workflow_dispatch rehearsal without the secrets still builds, unsigned.
# The Windows installer is not signed: that belongs between the phases too, through
# packaging/build.py's --sign-tool for Inno Setup, and needs credentials of its own.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# One release at a time. A second tag pushed while this is running waits rather than
# racing it to the same release page.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
          # Intel Macs. macos-latest is Apple silicon, so without this leg an Intel Mac
          # gets nothing. macos-13 was retired on 2025-12-04; macos-15-intel is the
          # replacement and GitHub drops x86_64 macOS entirely after it retires in 2027,
          # at which point this leg has to go and Intel users need Rosetta or a local build.
          - os: macos-15-intel
            platform: macos
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    # A step's `if` cannot read `secrets`, so whether macOS can be signed is decided here.
    env:
      MACOS_SIGN: ${{ secrets.MACOS_CERT_P12 != '' && 'yes' || '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # macOS only, and the reason is licensing rather than preference. The
      # opencv-python-headless wheels for macOS vendor a Homebrew FFmpeg built
      # --enable-gpl, so they carry x264, x265, xvid, rubberband, vidstab and frei0r,
      # and cv2 hard-links the FFmpeg stack, so those cannot be stripped. GLEAPP
      # cannot ship GPL code, because the bundle also holds Apache-1.1 code that the
      # FSF lists as GPL-incompatible, and packaging/gleapp.spec refuses such a build.
      # conda-forge publishes an LGPL FFmpeg, so macOS takes OpenCV from there.
      # Pillow comes from conda-forge too, and that is not incidental. The PyPI
      # wheel vendors its own libharfbuzz built without CoreText, conda-forge's
      # pango needs one with it, and PyInstaller collapses two dylibs of the same
      # name into one. v2026.5.0 shipped a macOS app that could not import cv2 for
      # that reason. Taking both from conda-forge leaves one shared harfbuzz.
      # OpenCV 4.x cannot load the bundled content model, hence version >=5.
      - name: macOS, OpenCV and Pillow from conda-forge
        if: runner.os == 'macOS'
        shell: bash
        run: |
          curl -sL "https://micro.mamba.pm/api/micromamba/osx-$(uname -m | sed s/x86_64/64/)/latest" \
            | tar -xj bin/micromamba
          ./bin/micromamba create -y -p ./build-env -c conda-forge --no-rc \
            python=3.12 "py-opencv[version='>=5',build='headless*']" "ffmpeg=*=lgpl*" pillow
          echo "$PWD/build-env/bin" >> "$GITHUB_PATH"

      - name: Install build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -e ".[build]"
          python -c "import cv2; print('cv2', cv2.__version__, cv2.__file__)"

      # The tag names the version the assets will be published under, and
      # gleapp/__init__.py names the version the app reports. A release where those
      # disagree ships a binary that tells the examiner one thing while the download
      # page says another, so the mismatch stops the build here rather than being
      # found in the report of a case.
      - name: Resolve the version, and check it against the tag
        shell: bash
        run: |
          VERSION="$(python -c "import sys; sys.path.insert(0, 'packaging'); import build; print(build.read_version())")"
          echo "gleapp/__init__.py __version__ = $VERSION"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "tag = $GITHUB_REF_NAME"
            if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match __version__ $VERSION (expected tag v$VERSION)"
              exit 1
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Phase 1, the executable
        shell: bash
        run: python packaging/build.py exe

      # The same headless pair test_builds.yml runs. Neither opens a window.
      # --version is answered by packaging/entrypoint.py before the desktop shell is
      # imported, and --texworker is the isolated decoder the app re-invokes, so it
      # exercises Pillow and the texture decoders inside the frozen bundle on a real
      # file. An asset that fails either one never reaches the release.
      - name: Smoke test the frozen binary, headless
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=dist/GLEAPP/GLEAPP.exe; else BIN=dist/GLEAPP/GLEAPP; fi
          WANT="GLEAPP $VERSION"
          GOT="$("$BIN" --version)"
          echo "--version -> '$GOT'"
          [ "$GOT" = "$WANT" ] || { echo "::error::expected '$WANT'"; exit 1; }
          python -c 'from PIL import Image; Image.new("RGB", (64, 48), (30, 120, 200)).save("smoke_in.png")'
          "$BIN" --texworker smoke_in.png smoke_out.jpg 32
          [ -s smoke_out.jpg ] || { echo "::error::--texworker produced no output"; exit 1; }
          echo "--texworker -> $(wc -c < smoke_out.jpg) bytes"
          # The import the two checks above never make. cv2 comes in through
          # gleapp.desktop, so a bundle can pass both of them and still not start.
          "$BIN" --selfcheck

      # A tag must not ship an unsigned Mac build by accident. Without the secrets a
      # rehearsal (workflow_dispatch) still builds, unsigned; a tag stops here.
      - name: macOS, refuse an unsigned release
        if: runner.os == 'macOS' && github.ref_type == 'tag' && env.MACOS_SIGN != 'yes'
        shell: bash
        run: |
          echo "::error::MACOS_CERT_P12 is not set; a tagged release must be signed"
          exit 1

      # A throwaway keychain holding only the Developer ID certificate, deleted by the
      # last macOS step whatever happens.
      - name: macOS, import the Developer ID certificate
        if: runner.os == 'macOS' && env.MACOS_SIGN == 'yes'
        shell: bash
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Between the phases: PyInstaller strips signatures while it builds, and the disk
      # image must carry the signed bundle. Inside out, every Mach-O in the bundle first,
      # then the bundle itself with the entitlements the hardened runtime needs; --deep
      # is not used to sign, as Apple advises. find does not follow symlinks, so the
      # Frameworks/Resources cross-links of a PyInstaller bundle are signed once.
      - name: macOS, sign the app
        if: runner.os == 'macOS' && env.MACOS_SIGN == 'yes'
        shell: bash
        env:
          ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
          TEAM: ${{ secrets.MACOS_TEAM_ID }}
        run: |
          APP=dist/GLEAPP.app
          find "$APP/Contents" -type f ! -path "$APP/Contents/MacOS/GLEAPP" -print0 |
            while IFS= read -r -d '' f; do
              if file -b "$f" | grep -q 'Mach-O'; then
                codesign --force --timestamp --options runtime --sign "$ID" "$f"
              fi
            done
          codesign --force --timestamp --options runtime \
            --entitlements packaging/entitlements.plist --sign "$ID" "$APP"
          codesign --verify --strict --deep --verbose=2 "$APP"
          python packaging/build.py verify "$APP" --subject "$TEAM"

      # The hardened runtime is what breaks a frozen app, and the smoke test above ran
      # the unsigned one-folder build, not this bundle.
      - name: macOS, smoke test the signed app
        if: runner.os == 'macOS' && env.MACOS_SIGN == 'yes'
        shell: bash
        run: |
          BIN=dist/GLEAPP.app/Contents/MacOS/GLEAPP
          GOT="$("$BIN" --version)"
          [ "$GOT" = "GLEAPP $VERSION" ] || { echo "::error::signed app says '$GOT'"; exit 1; }
          "$BIN" --texworker smoke_in.png smoke_signed.jpg 32
          [ -s smoke_signed.jpg ] || { echo "::error::--texworker produced no output"; exit 1; }
          "$BIN" --selfcheck

      - name: Phase 2, the disk image (macOS only)
        if: runner.os == 'macOS'
        shell: bash
        run: python packaging/build.py installer

      - name: Phase 2, the installer (Windows only)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install innosetup --no-progress -y
          python packaging/build.py installer

      # Notarising the .dmg covers the signed .app inside it, and the stapled ticket lets
      # Gatekeeper accept it offline. A rejection prints Apple's log, which names the file.
      - name: macOS, sign, notarise and staple the disk image
        if: runner.os == 'macOS' && env.MACOS_SIGN == 'yes'
        shell: bash
        env:
          ID: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
        run: |
          DMG="dist/GLEAPP-$VERSION.dmg"
          codesign --force --timestamp --sign "$ID" "$DMG"
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "$DMG" --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" \
            --wait --output-format json | tee notary.json
          SUB_ID="$(python -c 'import json; print(json.load(open("notary.json"))["id"])')"
          STATUS="$(python -c 'import json; print(json.load(open("notary.json"))["status"])')"
          if [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$SUB_ID" --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER"
            echo "::error::notarisation $STATUS"
            exit 1
          fi
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$DMG"

      - name: macOS, remove the signing keychain and key
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"

      # Release assets are single files, so the one-folder build is archived. The
      # names carry the platform and the architecture, because macos-latest is arm64
      # and a reader cannot tell from "GLEAPP-0.1.0.dmg" whether it runs on their Mac.
      # tar keeps the executable bit; the Windows zip has no bit to keep.
      - name: Name the assets
        shell: bash
        run: |
          mkdir -p assets
          ARCH="$(echo "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          STEM="GLEAPP-$VERSION-${{ matrix.platform }}-$ARCH"
          case "$RUNNER_OS" in
            Windows)
              powershell -NoProfile -Command "Compress-Archive -Path 'dist/GLEAPP/*' -DestinationPath 'assets/$STEM-portable.zip'"
              mv "dist/GLEAPP-Setup-$VERSION.exe" "assets/$STEM-setup.exe"
              ;;
            macOS)
              mv "dist/GLEAPP-$VERSION.dmg" "assets/$STEM.dmg"
              ;;
            Linux)
              tar -C dist -czf "assets/$STEM.tar.gz" GLEAPP
              ;;
          esac
          ls -l assets/

      - name: Upload the assets
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.os }}
          path: assets/*
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Collect every platform's assets
        uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: assets-*
          merge-multiple: true

      # An examiner who downloads a forensic tool should be able to check that what
      # they got is what was built. The file is generated here, over the assets as
      # they will be attached, rather than per platform, so one file covers them all.
      - name: Checksums
        shell: bash
        run: |
          cd assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # A draft, so the assets and the generated notes can be read before the release
      # is visible. Publishing it is a deliberate click, not a consequence of pushing
      # a tag. --generate-notes writes the changelog from the merged pull requests.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every release has to carry the same few things: which file is for which
          # platform, which binaries are signed and what the first launch does, and how
          # to check a download against SHA256SUMS.txt. They live in
          # .github/release-footer.md so editing them needs no workflow change.
          #
          # gh's --generate-notes replaces notes rather than appending to them, so the
          # changelog is generated through the API and the two are joined here.
          gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" --jq .body > notes.md
          cat .github/release-footer.md >> notes.md
          test -s notes.md || { echo "::error::composed release notes are empty"; exit 1; }
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "GLEAPP $GITHUB_REF_NAME" \
            --notes-file notes.md \
            assets/*
          echo "Draft release created. Review the assets, then publish it."
